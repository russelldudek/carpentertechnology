name: Publish candidate campaign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand audited campaign source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          payload = base64.b64decode(Path('campaign.bundle').read_text())
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              archive.extractall('.')
          Path('campaign.bundle').unlink()
          PY

      - name: Acquire official Carpenter Technology logo
        run: |
          mkdir -p assets/brand docs
          curl --fail --location --retry 3 \
            'https://brand.carpentertechnology.com/hubfs/Brand%20Guidelines%202022/assets/Downloadable%20Assets/Logos%20Page%20Assets/Carpenter_Technology.png' \
            --output assets/brand/Carpenter_Technology.png

      - name: Build and validate printable artifacts
        run: |
          python -m pip install --disable-pip-version-check weasyprint pypdf beautifulsoup4 pillow
          python build_pdfs.py
          python qa_ci.py

      - name: Commit complete campaign to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Carpenter Technology campaign [skip ci]"
          git push origin main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
